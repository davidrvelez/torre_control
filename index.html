<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torre de Control · Clínica Angiosur</title>
<style>
  :root{
    --azul-profundo:#0B2E4A;   /* navy para textos de alto contraste */
    --azul-angiosur:#0098DA;   /* azul oficial del logotipo */
    --rojo-angiosur:#BF0222;   /* rojo oficial del logotipo */
    --gris-marca:#808893;      /* gris del subtítulo "Clínica Neurocardiovascular" */
    --gris-fondo:#F1F5F4;      /* mismo fondo que el iframe embebido */
    --gris-borde:#E2E7E9;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--gris-fondo);
    font-family:'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    color:var(--azul-profundo);
  }

  /* Franja superior institucional */
  .franja{
    height:4px;
    width:100%;
    background:linear-gradient(90deg, var(--azul-angiosur) 0%, var(--azul-angiosur) 55%, var(--rojo-angiosur) 100%);
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    padding:14px 28px;
    background:#FFFFFF;
    border-bottom:1px solid var(--gris-borde);
    box-shadow:0 2px 10px rgba(11,46,74,0.06);
    position:relative;
    z-index:5;
  }

  .marca{
    display:flex;
    align-items:center;
    gap:18px;
  }

  .marca .logo-wrap{
    display:flex;
    align-items:center;
    height:40px;
  }

  .logo-wrap img{
    height:40px;
    width:auto;
    display:block;
  }

  .separador-marca{
    width:1px;
    height:34px;
    background:var(--gris-borde);
  }

  .titulo-grupo{
    display:flex;
    flex-direction:column;
    line-height:1.15;
  }

  .titulo-grupo .eyebrow{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--azul-angiosur);
    font-weight:700;
  }

  .titulo-grupo h1{
    margin:2px 0 0 0;
    font-size:18px;
    font-weight:600;
    color:var(--azul-profundo);
    letter-spacing:.01em;
  }

  .estado{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12.5px;
    color:var(--gris-marca);
    background:var(--gris-fondo);
    border:1px solid var(--gris-borde);
    padding:6px 12px;
    border-radius:20px;
    white-space:nowrap;
  }

  .punto-en-vivo{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--azul-angiosur);
    box-shadow:0 0 0 0 rgba(0,152,218,.6);
    animation:pulso 2s infinite;
  }

  @keyframes pulso{
    0%{box-shadow:0 0 0 0 rgba(0,152,218,.45);}
    70%{box-shadow:0 0 0 8px rgba(0,152,218,0);}
    100%{box-shadow:0 0 0 0 rgba(0,152,218,0);}
  }

  main{
    height:calc(100vh - 66px - 4px);
    width:100%;
    padding:18px 24px 22px 24px;
    display:flex;
  }

  .lienzo-tablero{
    flex:1;
    display:flex;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 6px 24px rgba(11,46,74,0.14);
    border:1px solid var(--gris-borde);
    background:var(--gris-fondo);
  }

  iframe{
    background:#F1F5F4;
    border:none;
    width:100%;
    height:100%;
    display:block;
  }

  @media (max-width:640px){
    header{padding:10px 14px;}
    .logo-wrap{height:28px;}
    .logo-wrap img{height:28px;}
    .separador-marca{height:24px;}
    .titulo-grupo h1{font-size:14px;}
    .titulo-grupo .eyebrow{font-size:9.5px;}
    .estado{display:none;}
    main{padding:10px;height:calc(100vh - 58px - 4px);}
  }
</style>
</head>
